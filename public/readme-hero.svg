<svg width="1120" height="430" viewBox="0 0 1120 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="70" y1="30" x2="1050" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151A20"/>
      <stop offset="1" stop-color="#0D1116"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4FF72"/>
      <stop offset="1" stop-color="#A7F000"/>
    </linearGradient>
    <linearGradient id="plateTop" x1="690" y1="100" x2="940" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7FF26" stop-opacity=".95"/>
      <stop offset="1" stop-color="#5A7800"/>
    </linearGradient>
    <linearGradient id="plateSide" x1="760" y1="140" x2="900" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CCB08"/>
      <stop offset="1" stop-color="#334500"/>
    </linearGradient>
    <filter id="shadow" x="610" y="90" width="400" height="300" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="640" y="60" width="360" height="280" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .float { animation: float 4.5s ease-in-out infinite; transform-origin: 800px 210px; }
      .float2 { animation: float2 5.5s ease-in-out infinite; transform-origin: 800px 210px; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
      @keyframes float2 { 0%,100% { transform: translateY(4px) rotate(2deg); } 50% { transform: translateY(-8px) rotate(-2deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="428" rx="28" fill="url(#panel)" stroke="#303A45" stroke-width="2"/>
  <path d="M64 98H1056M64 336H1056" stroke="#28323D"/>
  <path d="M580 30V400M640 30V400M700 30V400M760 30V400M820 30V400M880 30V400M940 30V400" stroke="#1A242D" opacity=".55"/>
  <path d="M580 70H1056M580 130H1056M580 190H1056M580 250H1056M580 310H1056" stroke="#1A242D" opacity=".55"/>

  <g transform="translate(64 48)">
    <g transform="translate(0 5)" stroke="#C8FF00" stroke-width="3">
      <path d="M5 10L20 25M5 20L20 5M11 2L25 16M0 15L10 25"/>
    </g>
    <text x="38" y="25" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">FitLog</text>
    <text x="120" y="25" fill="#7B8794" font-family="Arial, sans-serif" font-size="22"> / Workout Library</text>
    <circle cx="848" cy="18" r="4" fill="#C8FF00" class="pulse"/>
    <text x="864" y="23" fill="#C8FF00" font-family="Arial, sans-serif" font-size="10" letter-spacing="3">BUILT TO TRAIN</text>
  </g>

  <g transform="translate(64 142)">
    <text fill="#C8FF00" font-family="Arial, sans-serif" font-size="11" letter-spacing="4">CHOOSE YOUR LIFT. LOG YOUR WORK.</text>
    <text y="72" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="58" font-weight="800">Train with intent.</text>
    <text y="132" fill="url(#lime)" font-family="Arial, sans-serif" font-size="58" font-weight="800">Log every set.</text>
    <text y="172" fill="#B0BAC5" font-family="Arial, sans-serif" font-size="17">Explore workouts. Build your plan.</text>
    <text y="198" fill="#B0BAC5" font-family="Arial, sans-serif" font-size="17">Keep the week's work moving forward.</text>
    <g transform="translate(0 226)">
      <rect width="108" height="30" rx="7" fill="#C8FF00"/>
      <text x="20" y="20" fill="#0D1116" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">WORKOUTS</text>
      <rect x="120" width="94" height="30" rx="7" fill="#202A32" stroke="#3D4A55"/>
      <text x="141" y="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PLAN</text>
      <rect x="226" width="100" height="30" rx="7" fill="#202A32" stroke="#3D4A55"/>
      <text x="245" y="20" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TRACKING</text>
    </g>
  </g>

  <g class="pulse" opacity=".35" filter="url(#shadow)">
    <ellipse cx="807" cy="354" rx="178" ry="26" fill="#C8FF00"/>
  </g>
  <g class="float2" filter="url(#glow)">
    <path d="M654 276L804 342L966 274L816 217L654 276Z" fill="#364A08" stroke="#C8FF00" stroke-width="2"/>
    <path d="M654 276L654 297L804 366L804 342L654 276Z" fill="url(#plateSide)" stroke="#8EB800"/>
    <path d="M804 342L966 274L966 295L804 366V342Z" fill="#4E6904" stroke="#8EB800"/>
    <path d="M704 274L816 231L919 273L805 323L704 274Z" fill="#11171C" stroke="#C8FF00" stroke-width="2"/>
    <path d="M748 273L814 247L875 273L805 302L748 273Z" fill="#2C3B0A" stroke="#9BC400"/>
    <circle cx="815" cy="273" r="10" fill="#C8FF00"/>
  </g>
  <g class="float">
    <path d="M638 188L786 126L946 187L797 249L638 188Z" fill="url(#plateTop)" stroke="#E9FF79" stroke-width="2"/>
    <path d="M638 188L638 210L786 274L786 249L638 188Z" fill="#607A05" stroke="#A9D20B"/>
    <path d="M786 249L946 187L946 209L786 274V249Z" fill="#3D5003" stroke="#A9D20B"/>
    <path d="M686 187L786 146L895 187L797 227L686 187Z" fill="#11171C" stroke="#C8FF00" stroke-width="2"/>
    <path d="M725 187L786 163L853 187L796 211L725 187Z" fill="#2E3B0A" stroke="#A7CF0A"/>
    <circle cx="786" cy="187" r="10" fill="#C8FF00"/>
    <path d="M786 119V77M768 90L786 72L804 90" stroke="#C8FF00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(64 356)">
    <text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">12</text>
    <text x="33" y="5" fill="#8B98A5" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">WORKOUTS</text>
    <path d="M180 0V27M390 0V27M600 0V27" stroke="#34404B"/>
    <text x="218" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">05</text>
    <text x="251" y="5" fill="#8B98A5" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">PLAN CAP</text>
    <text x="428" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">03</text>
    <text x="461" y="5" fill="#8B98A5" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">SORT MODES</text>
    <text x="760" y="5" fill="#C8FF00" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">EXPLORE / SELECT / LOG</text>
  </g>
</svg>
